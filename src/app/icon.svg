<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f9ff" />
    </linearGradient>
  </defs>
  
  <!-- Sleek Square Rounded Badge -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" />
  
  <!-- Subtle Neon Glow Ring -->
  <rect x="10" y="10" width="108" height="108" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3" />
  
  <!-- Bold Crisp ODS Monogram Text -->
  <text x="64" y="80" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-1.5">ODS</text>
  
  <!-- Cyan Accent Dot -->
  <circle cx="98" cy="30" r="7" fill="#38bdf8" />
</svg>
